version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mystore-kavita_kavita_1
      APP_PORT: 5000

  kavita:
    image: lscr.io/linuxserver/kavita:latest
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
